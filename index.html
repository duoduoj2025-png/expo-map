<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>大会逛展地图</title>
<style>
:root{
  --c-yellow:#FFD24A; --c-yellow2:#FFC93C; --c-green:#A8E063; --c-green2:#7ED957; --c-green3:#5DBB46;
  --c-blue:#6EC6F0; --c-blue2:#4FB3E8; --c-cream:#FFF7E6; --c-white:#ffffff;
  --c-ground:#ECEEF0; --c-road:#C9CDD3; --c-shadow:rgba(185,179,199,.45);
  --c-text:#5A4A3C;
  --font-round:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font-round);color:var(--c-text);
  background:linear-gradient(180deg,#EAF4FB 0%,var(--c-ground) 40%,#E4E7EA 100%)}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:100%;pointer-events:none;
  background:radial-gradient(600px 200px at 20% 8%,rgba(255,255,255,.9),transparent 70%),
             radial-gradient(500px 160px at 80% 6%,rgba(110,198,240,.25),transparent 70%)}

/* ===== 顶栏 & 面包屑 ===== */
header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;
  padding:12px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:var(--c-yellow);border-radius:999px;
  padding:8px 18px;font-weight:800;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.06),0 8px 20px var(--c-shadow)}
.logo .dot{width:14px;height:14px;border-radius:50%;background:var(--c-white);box-shadow:inset -3px -3px 0 rgba(0,0,0,.08)}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb{background:var(--c-white);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px;
  cursor:pointer;box-shadow:0 3px 10px var(--c-shadow);transition:.18s;border:2px solid transparent}
.crumb:hover{transform:translateY(-2px)}
.crumb.active{background:var(--c-green);color:#fff;border-color:var(--c-green3)}
.crumb-sep{color:#b7a89a;font-weight:800}
.hint{margin-left:auto;background:rgba(255,255,255,.85);border-radius:999px;padding:7px 14px;
  font-size:12px;font-weight:600;color:#8a7a6a;box-shadow:0 3px 10px var(--c-shadow)}

/* ===== 场景容器（等距画布） ===== */
#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:grab}
#scene.drag{cursor:grabbing}
#world{position:relative;transform-origin:50% 50%;transition:transform .5s cubic-bezier(.34,1.4,.5,1)}

/* 等距瓦片：菱形地块，两块瓦(左半/右半)拼成菱形面 */
.tile{position:absolute;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),filter .25s}
.tile:hover{transform:translateZ(0) scale(1.06);filter:brightness(1.05)}
.tile:active{transform:scale(.96)}
.tile .roof{position:absolute;pointer-events:none}

/* 展开动画 */
.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{0%{transform:scale(.3) translateY(-60px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}

/* ===== 底部信息条 ===== */
footer{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;gap:10px;
  padding:14px;flex-wrap:wrap;pointer-events:none}
.legend{background:rgba(255,255,255,.92);border-radius:18px;padding:10px 18px;font-size:12px;font-weight:700;
  box-shadow:0 6px 18px var(--c-shadow);pointer-events:auto;display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* ===== 展位详情弹层 ===== */
#modal-mask{position:fixed;inset:0;background:rgba(90,74,60,.28);backdrop-filter:blur(3px);
  z-index:100;display:none;align-items:flex-end;justify-content:center}
#modal-mask.show{display:flex}
#modal{background:var(--c-white);border-radius:28px 28px 0 0;max-width:480px;width:100%;
  padding:24px 24px 34px;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.4,.5,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.12)}
#modal-mask.show #modal{transform:translateY(0)}
#modal .m-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
#modal .m-badge{width:56px;height:56px;border-radius:18px;background:var(--c-yellow);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;
  box-shadow:0 6px 0 rgba(0,0,0,.06);flex:none}
#modal .m-name{font-size:20px;font-weight:800}
#modal .m-tag{font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 12px;margin-top:4px;display:inline-block}
#modal .m-desc{font-size:13.5px;line-height:1.8;color:#7a6a5a;background:var(--c-cream);
  border-radius:16px;padding:14px 16px;margin-bottom:16px}
#modal .m-actions{display:flex;gap:10px}
#modal .m-actions button{flex:1;border:none;border-radius:16px;padding:13px;font-size:14px;font-weight:800;
  cursor:pointer;font-family:inherit;transition:.15s}
#modal .m-actions button:active{transform:scale(.96)}
.btn-primary{background:var(--c-yellow);color:var(--c-text);box-shadow:0 5px 0 #e0af2e}
.btn-ghost{background:var(--c-cream);color:var(--c-text);box-shadow:0 5px 0 #eadfcb}
#modal .m-close{position:absolute;right:18px;top:16px;width:34px;height:34px;border-radius:50%;
  background:var(--c-ground);border:none;font-size:16px;font-weight:800;color:var(--c-text);cursor:pointer}

/* 出租车 & 装饰动画 */
@keyframes drive{0%{left:-8%}100%{left:108%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin-line{to{stroke-dashoffset:-40}}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span><span id="logo-text">大会逛展地图</span></div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="hint" id="hint">点击场馆进入 · 拖动查看全图</div>
</header>

<div id="scene"><div id="world"></div></div>

<footer><div class="legend" id="legend"></div></footer>

<div id="modal-mask">
  <div id="modal" style="position:relative">
    <button class="m-close" onclick="closeModal()">✕</button>
    <div class="m-top">
      <div class="m-badge" id="m-badge">A1</div>
      <div><div class="m-name" id="m-name">展位名称</div><span class="m-tag" id="m-tag">标签</span></div>
    </div>
    <div class="m-desc" id="m-desc">展位介绍</div>
    <div class="m-actions">
      <button class="btn-primary" onclick="closeModal()">加入逛展路线</button>
      <button class="btn-ghost" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
/* ================= 数据模型 ================= */
const HALLS = [
  {id:'A',name:'A馆 · 智能科技',color:'#FFD24A',color2:'#FFC93C',tag:'科技前沿',roof:'🤖',desc:'聚焦人工智能、智能硬件与前沿科技，汇集行业领军品牌首发新品。'},
  {id:'B',name:'B馆 · 绿色生活',color:'#A8E063',color2:'#7ED957',tag:'可持续',roof:'🌱',desc:'绿色能源、环保材料与可持续生活方式，体验未来绿色人居。'},
  {id:'C',name:'C馆 · 文化创意',color:'#6EC6F0',color2:'#4FB3E8',tag:'创意潮流',roof:'🎨',desc:'文创设计、数字艺术与潮流IP，感受创意与文化的碰撞。'}
];
const ZONE_TAGS=['智能硬件','AI应用','机器人','新能源','环保材料','循环经济','数字艺术','潮流IP','文创设计','互动体验'];
const BOOTH_TYPES=[
  {icon:'🤖',t:'智能终端'},{icon:'💡',t:'解决方案'},{icon:'🚗',t:'智能出行'},
  {icon:'⚡',t:'能源科技'},{icon:'♻️',t:'循环再生'},{icon:'🌿',t:'生态材料'},
  {icon:'🖼️',t:'数字艺术'},{icon:'🎪',t:'潮流体验'},{icon:'🎁',t:'文创好物'},{icon:'☕',t:'休闲驿站'}
];
function zonesOf(hallId){
  const out=[];
  for(let i=1;i<=10;i++){
    out.push({id:hallId+i,name:`${hallId}${i} 区 · ${ZONE_TAGS[i-1]}`,hallId,
      color:HALLS.find(h=>h.id===hallId).color,zoneIdx:i});
  }
  return out;
}
function boothsOf(zone){
  const out=[];
  for(let j=1;j<=10;j++){
    const bt=BOOTH_TYPES[(zone.zoneIdx+j)%10];
    out.push({id:`${zone.id}-${j}`,name:`${bt.t} ${j}号展位`,zone:zone.id,icon:bt.icon,
      color:zone.color,desc:`位于 ${zone.name}，展示${bt.t}领域最新成果，提供现场互动体验与新品试用，欢迎前来打卡咨询。`});
  }
  return out;
}

/* ================= 等距几何 ================= */
/* 把逻辑网格坐标(x,y)投到等距屏幕坐标 */
const ISO={dx:96,dy:52};          // 半格宽/半高
function isoPos(gx,gy){return {x:(gx-gy)*ISO.dx, y:(gx+gy)*ISO.dy};}

/* 生成一个菱形地块SVG背景（带草地包边+软阴影） */
function tileFace(color,edge){
  return `<svg width="100%" height="100%" viewBox="0 0 200 104" preserveAspectRatio="none">
    <polygon points="100,4 196,52 100,100 4,52" fill="${edge}" opacity=".9"/>
    <polygon points="100,10 188,52 100,94 12,52" fill="${color}"/>
    <polygon points="100,10 188,52 100,94 12,52" fill="url(#shade)" opacity=".25"/>
  </svg>`;
}
function svgDefs(){return `
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".18"/>
  </linearGradient>
</defs></svg>`;}

/* 道路：连接两格的等距路面 */
function roadEl(x1,y1,x2,y2,w){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const ang=Math.atan2(dy,dx)*180/Math.PI;
  return `<div class="road" style="position:absolute;left:${x1}px;top:${y1}px;width:${len}px;height:${w}px;
    transform-origin:0 50%;transform:rotate(${ang}deg) translateY(-50%);
    background:${'var(--c-road)'};border-radius:99px;
    background-image:repeating-linear-gradient(90deg,transparent 0 14px,#fff 14px 24px);
    background-size:100% 3px;background-position:center;background-repeat:no-repeat;
    box-shadow:0 4px 8px var(--c-shadow);"></div>`;
}

/* 建筑：等距小盒子(顶面+左墙+右墙)，屋顶放emoji IP */
function building(color,icon,w=64){
  const h=Math.round(w*0.42);
  const topW=w, topH=Math.round(w*0.52);
  return `<div style="position:relative;width:${w}px;height:${w}px;pointer-events:none">
    <!-- 右墙 -->
    <div style="position:absolute;left:${w/2}px;top:${h+topH/2}px;width:${w/2}px;height:${h}px;
      background:${shadeColor(color,-22)};transform:skewX(-26.5deg);transform-origin:top left"></div>
    <!-- 左墙 -->
    <div style="position:absolute;left:0;top:${h+topH/2}px;width:${w/2}px;height:${h}px;
      background:${shadeColor(color,-12)};transform:skewX(26.5deg);transform-origin:top right"></div>
    <!-- 顶面 -->
    <div style="position:absolute;left:0;top:${h}px;width:${w}px;height:${topH}px;
      background:${color};border-radius:6px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)"></div>
    <!-- 屋顶IP -->
    <div class="ip" style="position:absolute;left:50%;top:${h-topH*0.1}px;transform:translate(-50%,-60%);
      font-size:${Math.round(w*0.34)}px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15));
      animation:float 3s ease-in-out infinite">${icon}</div>
  </div>`;
}
function shadeColor(hex,pct){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(v+(pct/100)*255)));
  return '#'+((1<<24)+(f(r)<<16)+(f(g)<<8)+f(b)).toString(16).slice(1);
}

/* 树木装饰 */
function tree(x,y,s=1){
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${26*s}px;height:${30*s}px;pointer-events:none;
    animation:float ${3+Math.random()*2}s ease-in-out infinite ${Math.random()}s">
    <div style="position:absolute;left:${10*s}px;top:${16*s}px;width:${6*s}px;height:${14*s}px;background:#B08956;border-radius:3px"></div>
    <div style="position:absolute;left:0;top:0;width:${26*s}px;height:${20*s}px;background:var(--c-green2);border-radius:50%"></div>
    <div style="position:absolute;left:${5*s}px;top:${12*s}px;width:${16*s}px;height:${13*s}px;background:var(--c-green);border-radius:50%"></div>
  </div>`;
}
/* 出租车 */
function car(top,dur,delay){
  return `<div style="position:absolute;top:${top}px;left:-60px;width:54px;height:26px;pointer-events:none;
    animation:drive ${dur}s linear ${delay}s infinite;z-index:1">
    <div style="position:absolute;bottom:0;left:0;width:54px;height:14px;background:var(--c-yellow2);border-radius:7px 10px 4px 4px;
      box-shadow:0 3px 6px var(--c-shadow)"></div>
    <div style="position:absolute;bottom:10px;left:10px;width:26px;height:12px;background:#9ADCF5;border-radius:6px 8px 0 0"></div>
    <div style="position:absolute;bottom:16px;left:18px;width:10px;height:5px;background:#fff;border-radius:2px"></div>
    <div style="position:absolute;bottom:-2px;left:7px;width:10px;height:10px;background:#4a4a52;border-radius:50%"></div>
    <div style="position:absolute;bottom:-2px;left:37px;width:10px;height:10px;background:#4a4a52;border-radius:50%"></div>
  </div>`;
}

/* ================= 场景渲染 ================= */
const world=document.getElementById('world');
const sceneEl=document.getElementById('scene');
let state={hall:null,zone:null};

function setTitle(){
  const lt=document.getElementById('logo-text');
  if(state.zone) lt.textContent=state.zone.name.split(' · ')[0]+' 展位图';
  else if(state.hall) lt.textContent=state.hall.name.split(' · ')[0]+' 区域图';
  else lt.textContent='大会逛展地图';
}
function renderCrumbs(){
  const c=document.getElementById('crumbs');let html=`<span class="crumb ${!state.hall?'active':''}" data-lv="0">总览</span>`;
  if(state.hall) html+=`<span class="crumb-sep">›</span><span class="crumb ${!state.zone?'active':''}" data-lv="1">${state.hall.id}馆</span>`;
  if(state.zone) html+=`<span class="crumb-sep">›</span><span class="crumb active" data-lv="2">${state.zone.id}区</span>`;
  c.innerHTML=html;
  c.querySelectorAll('.crumb').forEach(el=>el.onclick=()=>{
    const lv=+el.dataset.lv;
    if(lv===0){state.hall=null;state.zone=null}
    if(lv===1){state.zone=null}
    render();
  });
}
function setHint(t){document.getElementById('hint').textContent=t}
function setLegend(items){
  document.getElementById('legend').innerHTML=items.map(i=>`<span><i style="background:${i.c}"></i>${i.n}</span>`).join('');
}

/* --- 布局计算 & 通用网格绘制 --- */
function gridLayout(count,cols,cellW,cellH,gapX,gapY){
  const rows=Math.ceil(count/cols);
  const pos=[];let k=0;
  for(let gy=rows-1;gy>=0;gy--)for(let gx=0;gx<cols;gx++){
    if(k>=count)break;
    const p=isoPos(gx*(1+gapX),gy*(1+gapY));
    pos.push({x:p.x,y:p.y});k++;
  }
  const minX=Math.min(...pos.map(p=>p.x)),maxX=Math.max(...pos.map(p=>p.x));
  const minY=Math.min(...pos.map(p=>p.y)),maxY=Math.max(...pos.map(p=>p.y));
  const W=maxX-minX+cellW*2+120, H=maxY-minY+cellH*3+80;
  return {pos:pos.map(p=>({x:p.x-minX+cellW+60,y:p.y-minY+cellH+40})),W,H,cols,rows};
}
/* 画格间道路（同行相邻 + 行间首列连接，形成回廊动线） */
function roadsHTML(L){
  let html='';
  for(let i=0;i<L.pos.length;i++){
    const r=Math.floor(i/L.cols),c=i%L.cols;
    if(c<L.cols-1&&i+1<L.pos.length){
      const a=L.pos[i],b=L.pos[i+1];
      html+=roadEl(a.x+40,a.y+20,b.x+40,b.y+20,26);
    }
    if(r<L.rows-1&&L.pos[i+L.cols]){
      const a=L.pos[i],b=L.pos[i+L.cols];
      html+=roadEl(a.x+40,a.y+20,b.x+40,b.y+40-20,26);
    }
  }
  return html;
}

function render(){
  world.innerHTML='';
  renderCrumbs();setTitle();
  if(!state.hall) renderOverview();
  else if(!state.zone) renderHall();
  else renderZone();
  /* 适配缩放 */
  fitWorld();
}
function fitWorld(){
  const L=world.dataset;
  const W=+L.w||1200,H=+L.h||800;
  const s=Math.min(sceneEl.clientWidth/(W+80),sceneEl.clientHeight/(H+120),1.25);
  world.style.width=W+'px';world.style.height=H+'px';
  world.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fitWorld);

/* --- 层级1：总览（3馆） --- */
function renderOverview(){
  setHint('点击场馆进入 · 拖动查看全图');
  setLegend([{c:'#FFD24A',n:'A馆 智能科技'},{c:'#A8E063',n:'B馆 绿色生活'},{c:'#6EC6F0',n:'C馆 文化创意'}]);
  const cell=180; // 地块尺寸
  const L={pos:[
    isoPos(0,1.9),isoPos(1.4,1.9),isoPos(2.8,1.9),
  ].map(p=>({x:p.x,y:p.y})),cols:3};
  const xs=L.pos.map(p=>p.x),ys=L.pos.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const W=maxX-minX+cell*2.4,H=maxY-minY+cell*1.9;
  L.pos=L.pos.map(p=>({x:p.x-minX+cell*1.2,y:p.y-minY+cell*0.95}));
  world.dataset.w=W;world.dataset.h=H;
  let html=svgDefs();
  /* 馆间道路 */
  for(let i=0;i<2;i++){
    const a=L.pos[i],b=L.pos[i+1];
    html+=roadEl(a.x+cell/2,a.y+cell*0.34,b.x+cell/2,b.y+cell*0.34,34);
  }
  /* 装饰 */
  html+=tree(-20,40,1.1)+tree(W-80,-30,0.9)+tree(W-140,60,1.2)+tree(-60,H-120,1)+car(H*0.62,14,2);
  HALLS.forEach((h,i)=>{
    const p=L.pos[i];
    html+=`<div class="tile pop" data-hall="${h.id}" style="width:${cell}px;height:${cell*0.66}px;left:${p.x}px;top:${p.y}px;
      animation-delay:${i*0.12}s;z-index:${10+i}">
      ${tileFace(h.color,shadeColor(h.color,-8))}
      <div class="roof" style="left:50%;top:50%;transform:translate(-50%,-58%)">
        ${building(h.color,h.roof,70)}
      </div>
      <div style="position:absolute;left:50%;top:82%;transform:translate(-50%,-50%);text-align:center;pointer-events:none">
        <div style="background:#fff;border-radius:14px;padding:6px 16px;font-weight:800;font-size:15px;
          box-shadow:0 4px 10px var(--c-shadow);white-space:nowrap">${h.name}</div>
        <div style="margin-top:6px;background:${h.color2};color:#fff;border-radius:999px;padding:3px 14px;
          font-size:11px;font-weight:800;display:inline-block;box-shadow:0 3px 8px var(--c-shadow)">${h.tag} · 10个区域 · 100个展位</div>
      </div>
    </div>`;
  });
  world.innerHTML=html;
  world.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    state.hall=HALLS.find(h=>h.id===t.dataset.hall);state.zone=null;render();
  });
}

/* --- 层级2：馆内10区域 --- */
function renderHall(){
  const h=state.hall;
  setHint('点击区域查看展位 · 顶部面包屑可返回');
  setLegend([{c:h.color,n:`${h.id}馆 · ${h.tag}`},{c:'#C9CDD3',n:'参观动线'}]);
  const cell=150;
  const zones=zonesOf(h.id);
  const L=gridLayout(10,5,cell,cell*0.66,0.55,0.55);
  world.dataset.w=L.W;world.dataset.h=L.H;
  let html=svgDefs()+roadsHTML(L);
  /* 动线车 */
  html+=car(L.H*0.55,18,1)+tree(L.W*0.06,L.H*0.1,1)+tree(L.W*0.92,L.H*0.15,0.9)+tree(L.W*0.5,L.H*0.02,1.1);
  zones.forEach((z,i)=>{
    const p=L.pos[i];
    html+=`<div class="tile pop" data-idx="${i}" style="width:${cell}px;height:${cell*0.66}px;left:${p.x}px;top:${p.y}px;
      animation-delay:${i*0.05}s;z-index:${20+i}">
      ${tileFace(z.color,shadeColor(z.color,-8))}
      <div class="roof" style="left:50%;top:46%;transform:translate(-50%,-50%)">
        ${building(z.color,ZONE_ROOFS[i],56)}
      </div>
      <div style="position:absolute;left:50%;top:80%;transform:translate(-50%,-50%);pointer-events:none">
        <div style="background:#fff;border-radius:12px;padding:4px 12px;font-weight:800;font-size:12.5px;
          box-shadow:0 4px 10px var(--c-shadow);white-space:nowrap">${z.name}</div>
      </div>
    </div>`;
  });
  world.innerHTML=html;
  world.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    state.zone=zones[+t.dataset.idx];render();
  });
}
const ZONE_ROOFS=['🏠','⚙️','🦾','🔋','🧴','♻️','🖼️','🕹️','🛍️','🥤'];

/* --- 层级3：区域10展位 --- */
function renderZone(){
  const z=state.zone;
  setHint('点击展位查看详情 · 面包屑返回上级');
  setLegend([{c:z.color,n:`${z.id}区 · 10个展位`},{c:'#C9CDD3',n:'步行道'}]);
  const booths=boothsOf(z);
  const cell=120;
  const L=gridLayout(10,5,cell,cell*0.66,0.5,0.5);
  world.dataset.w=L.W;world.dataset.h=L.H;
  let html=svgDefs()+roadsHTML(L);
  html+=tree(L.W*0.05,L.H*0.12,0.9)+tree(L.W*0.94,L.H*0.18,1)+tree(L.W*0.5,L.H*0.0,0.85);
  booths.forEach((b,i)=>{
    const p=L.pos[i];
    const num=b.id.split('-')[1];
    html+=`<div class="tile pop" data-idx="${i}" style="width:${cell}px;height:${cell*0.66}px;left:${p.x}px;top:${p.y}px;
      animation-delay:${i*0.04}s;z-index:${20+i}">
      ${tileFace(z.color,shadeColor(z.color,-8))}
      <div class="roof" style="left:50%;top:44%;transform:translate(-50%,-50%)">
        ${building(z.color,b.icon,44)}
      </div>
      <div style="position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);pointer-events:none;
        display:flex;align-items:center;gap:5px">
        <div style="background:${z.color};color:#fff;font-weight:800;font-size:10px;width:22px;height:22px;
          border-radius:7px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px var(--c-shadow)">${num}</div>
        <div style="background:#fff;border-radius:10px;padding:3px 9px;font-weight:700;font-size:10.5px;
          box-shadow:0 3px 8px var(--c-shadow);white-space:nowrap">${b.name}</div>
      </div>
    </div>`;
  });
  world.innerHTML=html;
  world.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    openModal(booths[+t.dataset.idx],z);
  });
}

/* ================= 展位详情 ================= */
const mask=document.getElementById('modal-mask');
function openModal(b,z){
  document.getElementById('m-badge').textContent=b.icon;
  document.getElementById('m-badge').style.background=z.color;
  document.getElementById('m-name').textContent=b.name;
  const tag=document.getElementById('m-tag');
  tag.textContent=`${z.hallId}馆 · ${z.id}区 · ${b.id}`;
  tag.style.background=z.color;
  document.getElementById('m-desc').textContent=b.desc;
  mask.classList.add('show');
}
function closeModal(){mask.classList.remove('show')}
mask.addEventListener('click',e=>{if(e.target===mask)closeModal()});

/* ================= 拖拽平移 ================= */
let drag=null;
sceneEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('.tile'))return;
  drag={x:e.clientX,y:e.clientY,ox:world.dataset.px||0,oy:world.dataset.py||0};
  sceneEl.classList.add('drag');
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const s=world.style.transform?parseFloat(world.style.transform.replace(/[^0-9.]/g,''))||1:1;
  const px=drag.ox+(e.clientX-drag.x)/s, py=drag.oy+(e.clientY-drag.y)/s;
  world.dataset.px=px;world.dataset.py=py;
  applyTransform();
});
window.addEventListener('pointerup',()=>{drag=null;sceneEl.classList.remove('drag')});
function applyTransform(){
  const s=world.style.transform?parseFloat(world.style.transform.replace(/[^0-9.]/g,''))||1:1;
  const px=world.dataset.px||0,py=world.dataset.py||0;
  world.style.transform=`translate(${px}px,${py}px) scale(${s})`;
}
const origFit=fitWorld;
fitWorld=function(){origFit();applyTransform()};

render();
</script>
</body>
</html>
